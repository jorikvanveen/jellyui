[package]
name = "jellyui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-channel = "2.5"
gpui = { git = "https://github.com/zed-industries/zed", branch = "main", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", branch = "main", default-features = false, features = ["wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pipewire = { version = "0.10.1", features = ["v0_3_50"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "mp3"] }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1"
ureq = { version = "3", features = ["json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zbus = "5.13"

[profile.dev]
debug = 1
